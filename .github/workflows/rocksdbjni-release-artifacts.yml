name: rocksdbjni-release-artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rocksdbjni-release-artifacts.yml"
      - "Makefile"
      - "java/**"

permissions:
  contents: read

jobs:
  build-linux-x86-and-x64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      DEBUG_LEVEL: 0
      J: "100%"
    steps:
      - uses: actions/checkout@v4
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockerx86 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux Classifier Targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerx86
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerx86_64
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerx86musl
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerx86_64musl
      - uses: actions/upload-artifact@v4
        with:
          name: rocksdbjni-linux-x86-and-x64
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux32.so
            java/target/librocksdbjni-linux64.so
            java/target/librocksdbjni-linux32-musl.so
            java/target/librocksdbjni-linux64-musl.so
            java/target/rocksdbjni-*-linux32.jar
            java/target/rocksdbjni-*-linux64.jar
            java/target/rocksdbjni-*-linux32-musl.jar
            java/target/rocksdbjni-*-linux64-musl.jar
            java/target/rocksdbjni-*-linux32.jar.sha1
            java/target/rocksdbjni-*-linux64.jar.sha1
            java/target/rocksdbjni-*-linux32-musl.jar.sha1
            java/target/rocksdbjni-*-linux64-musl.jar.sha1

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      DEBUG_LEVEL: 0
      J: "100%"
    steps:
      - uses: actions/checkout@v4
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockerarm64v8 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux Aarch64 Targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerarm64v8
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerarm64v8musl
      - uses: actions/upload-artifact@v4
        with:
          name: rocksdbjni-linux-aarch64
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux-aarch64.so
            java/target/librocksdbjni-linux-aarch64-musl.so

  build-linux-ppc64le-riscv64-s390x:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      DEBUG_LEVEL: 0
      J: "100%"
    steps:
      - uses: actions/checkout@v4
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockerppc64le 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux Emulated Targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerppc64le
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockers390x
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerriscv64
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerppc64lemusl
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockers390xmusl
      - uses: actions/upload-artifact@v4
        with:
          name: rocksdbjni-linux-ppc64le-riscv64-s390x
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux-ppc64le.so
            java/target/librocksdbjni-linux-ppc64le-musl.so
            java/target/librocksdbjni-linux-s390x.so
            java/target/librocksdbjni-linux-s390x-musl.so
            java/target/librocksdbjni-linux-riscv64.so

  build-osx:
    runs-on: macos-14
    timeout-minutes: 240
    env:
      DEBUG_LEVEL: 0
      J: "100%"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "8"
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticosx 2>&1 | grep -q "Compiling in debug mode"
      - name: Build OSX Classifier
        run: |
          set -euxo pipefail
          java -version
          javac -version
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticosx
      - uses: actions/upload-artifact@v4
        with:
          name: rocksdbjni-osx
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-osx-arm64.jnilib
            java/target/librocksdbjni-osx-x86_64.jnilib
            java/target/rocksdbjni-*-osx.jar
            java/target/rocksdbjni-*-osx.jar.sha1

  build-win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEBUG_LEVEL: 0
      CMAKE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${CMAKE_BUILD_TYPE}" = "Release"
      - name: Install Mingw Toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          if update-alternatives --query x86_64-w64-mingw32-g++ >/dev/null 2>&1; then
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix || true
          fi
      - name: Build Win64 JNI Classifier (Release)
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" CMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" rocksdbjavastaticwin64
          jar tf java/target/rocksdbjni-*-win64.jar | grep -Fx 'librocksdbjni-win64.dll'
      - uses: actions/upload-artifact@v4
        with:
          name: rocksdbjni-win64
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-win64.dll
            java/target/rocksdbjni-*-win64.jar
            java/target/rocksdbjni-*-win64.jar.sha1

  assemble-release-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - build-linux-x86-and-x64
      - build-linux-aarch64
      - build-linux-ppc64le-riscv64-s390x
      - build-osx
      - build-win64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - uses: actions/download-artifact@v4
        with:
          name: rocksdbjni-linux-x86-and-x64
          path: artifacts/linux-x86-and-x64
      - uses: actions/download-artifact@v4
        with:
          name: rocksdbjni-linux-aarch64
          path: artifacts/linux-aarch64
      - uses: actions/download-artifact@v4
        with:
          name: rocksdbjni-linux-ppc64le-riscv64-s390x
          path: artifacts/linux-ppc64le-riscv64-s390x
      - uses: actions/download-artifact@v4
        with:
          name: rocksdbjni-osx
          path: artifacts/osx
      - uses: actions/download-artifact@v4
        with:
          name: rocksdbjni-win64
          path: artifacts/win64
      - name: Assemble And Verify Fat Jar
        shell: bash
        run: |
          set -euxo pipefail

          find_one() {
            local root="$1"
            local name="$2"
            find "${root}" -type f -name "${name}" | head -n1
          }

          mkdir -p java/target output
          cp "$(find_one artifacts/linux-x86-and-x64 'librocksdbjni-linux32.so')" java/target/
          cp "$(find_one artifacts/linux-x86-and-x64 'librocksdbjni-linux64.so')" java/target/
          cp "$(find_one artifacts/linux-x86-and-x64 'librocksdbjni-linux32-musl.so')" java/target/
          cp "$(find_one artifacts/linux-x86-and-x64 'librocksdbjni-linux64-musl.so')" java/target/
          cp "$(find_one artifacts/linux-aarch64 'librocksdbjni-linux-aarch64.so')" java/target/
          cp "$(find_one artifacts/linux-aarch64 'librocksdbjni-linux-aarch64-musl.so')" java/target/
          cp "$(find_one artifacts/linux-ppc64le-riscv64-s390x 'librocksdbjni-linux-ppc64le.so')" java/target/
          cp "$(find_one artifacts/linux-ppc64le-riscv64-s390x 'librocksdbjni-linux-ppc64le-musl.so')" java/target/
          cp "$(find_one artifacts/linux-ppc64le-riscv64-s390x 'librocksdbjni-linux-s390x.so')" java/target/
          cp "$(find_one artifacts/linux-ppc64le-riscv64-s390x 'librocksdbjni-linux-s390x-musl.so')" java/target/
          cp "$(find_one artifacts/linux-ppc64le-riscv64-s390x 'librocksdbjni-linux-riscv64.so')" java/target/
          cp "$(find_one artifacts/osx 'librocksdbjni-osx-arm64.jnilib')" java/target/
          cp "$(find_one artifacts/osx 'librocksdbjni-osx-x86_64.jnilib')" java/target/
          cp "$(find_one artifacts/win64 'librocksdbjni-win64.dll')" java/target/

          make DEBUG_LEVEL=0 rocksdbjavastaticfatjarassemble
          FAT_JAR="$(find java/target -maxdepth 1 -type f -name 'rocksdbjni-*.jar' ! -name '*-linux*.jar' ! -name '*-osx.jar' ! -name '*-win64.jar' ! -name '*-javadoc.jar' ! -name '*-sources.jar' | head -n1)"
          test -n "${FAT_JAR}"

          # Validate native entry-name parity with 10.2.1.
          jar tf "${FAT_JAR}" | grep -E '^librocksdbjni-.*\.(so|jnilib|dll)$' | sort > actual-natives.txt
          curl -L -o rocksdbjni-10.2.1.jar https://repo1.maven.org/maven2/org/rocksdb/rocksdbjni/10.2.1/rocksdbjni-10.2.1.jar
          jar tf rocksdbjni-10.2.1.jar | grep -E '^librocksdbjni-.*\.(so|jnilib|dll)$' | sort > expected-natives.txt
          diff -u expected-natives.txt actual-natives.txt
          test "$(wc -l < actual-natives.txt)" -eq 14

          # Validate binary formats.
          file java/target/librocksdbjni-linux64.so | grep -q 'ELF 64-bit'
          file java/target/librocksdbjni-linux-riscv64.so | grep -q 'ELF 64-bit'
          file java/target/librocksdbjni-win64.dll | grep -Eq 'PE32\+ executable|PE32\+ DLL'
          readelf -h java/target/librocksdbjni-linux64.so | grep -q 'Machine:'

          cp "${FAT_JAR}" output/
          cp "${FAT_JAR}.sha1" output/

          cp "$(find_one artifacts/linux-x86-and-x64 'rocksdbjni-*-linux32.jar')" output/
          cp "$(find_one artifacts/linux-x86-and-x64 'rocksdbjni-*-linux64.jar')" output/
          cp "$(find_one artifacts/linux-x86-and-x64 'rocksdbjni-*-linux32-musl.jar')" output/
          cp "$(find_one artifacts/linux-x86-and-x64 'rocksdbjni-*-linux64-musl.jar')" output/
          cp "$(find_one artifacts/linux-x86-and-x64 'rocksdbjni-*-linux32.jar.sha1')" output/
          cp "$(find_one artifacts/linux-x86-and-x64 'rocksdbjni-*-linux64.jar.sha1')" output/
          cp "$(find_one artifacts/linux-x86-and-x64 'rocksdbjni-*-linux32-musl.jar.sha1')" output/
          cp "$(find_one artifacts/linux-x86-and-x64 'rocksdbjni-*-linux64-musl.jar.sha1')" output/
          cp "$(find_one artifacts/osx 'rocksdbjni-*-osx.jar')" output/
          cp "$(find_one artifacts/osx 'rocksdbjni-*-osx.jar.sha1')" output/
          cp "$(find_one artifacts/win64 'rocksdbjni-*-win64.jar')" output/
          cp "$(find_one artifacts/win64 'rocksdbjni-*-win64.jar.sha1')" output/
      - uses: actions/upload-artifact@v4
        with:
          name: rocksdbjni-release-artifacts
          if-no-files-found: error
          path: output/
