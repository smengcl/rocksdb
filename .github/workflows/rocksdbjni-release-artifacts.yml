name: rocksdbjni-release-artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rocksdbjni-release-artifacts.yml"
      - "Makefile"
      - "java/**"

permissions:
  contents: read

jobs:
  prepare-musl-x86:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DEBUG_LEVEL: 0
      J: "100%"
      ROCKSDB_GNU_CROSS_CACHE: /tmp/rocksdb-gnu-cross
    steps:
      - uses: actions/checkout@v5
      - name: Prepare GNU musl cross toolchain (x86)
        run: |
          set -euxo pipefail
          mkdir -p "${ROCKSDB_GNU_CROSS_CACHE}"
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" ROCKSDB_GNU_CROSS_CACHE="${ROCKSDB_GNU_CROSS_CACHE}" ROCKSDB_GNU_CROSS_MUSL_PREPARE_TRIPLES="x86-linux-musl" rocksdbjavastaticpreparegnuccrossmusltoolchains
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-gnu-musl-cross-x86
          if-no-files-found: error
          path: /tmp/rocksdb-gnu-cross/toolchains

  prepare-musl-x64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      DEBUG_LEVEL: 0
      J: "100%"
      ROCKSDB_GNU_CROSS_CACHE: /tmp/rocksdb-gnu-cross
    steps:
      - uses: actions/checkout@v5
      - name: Prepare GNU musl cross toolchain (x64)
        run: |
          set -euxo pipefail
          mkdir -p "${ROCKSDB_GNU_CROSS_CACHE}"
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" ROCKSDB_GNU_CROSS_CACHE="${ROCKSDB_GNU_CROSS_CACHE}" ROCKSDB_GNU_CROSS_MUSL_PREPARE_TRIPLES="x86_64-linux-musl" rocksdbjavastaticpreparegnuccrossmusltoolchains
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-gnu-musl-cross-x64
          if-no-files-found: error
          path: /tmp/rocksdb-gnu-cross/toolchains

  prepare-musl-ppc64le:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      DEBUG_LEVEL: 0
      J: "100%"
      ROCKSDB_GNU_CROSS_CACHE: /tmp/rocksdb-gnu-cross
    steps:
      - uses: actions/checkout@v5
      - name: Prepare GNU musl cross toolchain (ppc64le)
        run: |
          set -euxo pipefail
          mkdir -p "${ROCKSDB_GNU_CROSS_CACHE}"
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" ROCKSDB_GNU_CROSS_CACHE="${ROCKSDB_GNU_CROSS_CACHE}" ROCKSDB_GNU_CROSS_MUSL_PREPARE_TRIPLES="powerpc64le-linux-musl" rocksdbjavastaticpreparegnuccrossmusltoolchains
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-gnu-musl-cross-ppc64le
          if-no-files-found: error
          path: /tmp/rocksdb-gnu-cross/toolchains

  prepare-musl-s390x:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      DEBUG_LEVEL: 0
      J: "100%"
      ROCKSDB_GNU_CROSS_CACHE: /tmp/rocksdb-gnu-cross
    steps:
      - uses: actions/checkout@v5
      - name: Prepare GNU musl cross toolchain (s390x)
        run: |
          set -euxo pipefail
          mkdir -p "${ROCKSDB_GNU_CROSS_CACHE}"
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" ROCKSDB_GNU_CROSS_CACHE="${ROCKSDB_GNU_CROSS_CACHE}" ROCKSDB_GNU_CROSS_MUSL_PREPARE_TRIPLES="s390x-linux-musl" rocksdbjavastaticpreparegnuccrossmusltoolchains
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-gnu-musl-cross-s390x
          if-no-files-found: error
          path: /tmp/rocksdb-gnu-cross/toolchains

  build-linux-x86:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    needs:
      - prepare-musl-x86
    env:
      DEBUG_LEVEL: 0
      J: "100%"
      ROCKSDB_GNU_CROSS_CACHE: /tmp/rocksdb-gnu-cross
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-gnu-musl-cross-x86
          path: /tmp/rocksdb-gnu-cross/toolchains
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockerx86 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux x86 targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerx86
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerx86musl
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-linux-x86
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux32.so
            java/target/librocksdbjni-linux32-musl.so
            java/target/rocksdbjni-*-linux32.jar
            java/target/rocksdbjni-*-linux32-musl.jar
            java/target/rocksdbjni-*-linux32.jar.sha1
            java/target/rocksdbjni-*-linux32-musl.jar.sha1

  build-linux-x64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    needs:
      - prepare-musl-x64
    env:
      DEBUG_LEVEL: 0
      J: "100%"
      ROCKSDB_GNU_CROSS_CACHE: /tmp/rocksdb-gnu-cross
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-gnu-musl-cross-x64
          path: /tmp/rocksdb-gnu-cross/toolchains
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockerx86_64 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux x64 targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerx86_64
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerx86_64musl
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-linux-x64
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux64.so
            java/target/librocksdbjni-linux64-musl.so
            java/target/rocksdbjni-*-linux64.jar
            java/target/rocksdbjni-*-linux64-musl.jar
            java/target/rocksdbjni-*-linux64.jar.sha1
            java/target/rocksdbjni-*-linux64-musl.jar.sha1

  build-linux-aarch64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 240
    env:
      DEBUG_LEVEL: 0
      J: "100%"
    steps:
      - uses: actions/checkout@v5
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockerarm64v8 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux aarch64 targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerarm64v8
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerarm64v8musl
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-linux-aarch64
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux-aarch64.so
            java/target/librocksdbjni-linux-aarch64-musl.so
            java/target/rocksdbjni-*-linux-aarch64.jar
            java/target/rocksdbjni-*-linux-aarch64-musl.jar
            java/target/rocksdbjni-*-linux-aarch64.jar.sha1
            java/target/rocksdbjni-*-linux-aarch64-musl.jar.sha1

  build-linux-ppc64le:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    needs:
      - prepare-musl-ppc64le
    env:
      DEBUG_LEVEL: 0
      J: "100%"
      ROCKSDB_GNU_CROSS_CACHE: /tmp/rocksdb-gnu-cross
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-gnu-musl-cross-ppc64le
          path: /tmp/rocksdb-gnu-cross/toolchains
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockerppc64le 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux ppc64le targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerppc64le
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerppc64lemusl
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-linux-ppc64le
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux-ppc64le.so
            java/target/librocksdbjni-linux-ppc64le-musl.so
            java/target/rocksdbjni-*-linux-ppc64le.jar
            java/target/rocksdbjni-*-linux-ppc64le-musl.jar
            java/target/rocksdbjni-*-linux-ppc64le.jar.sha1
            java/target/rocksdbjni-*-linux-ppc64le-musl.jar.sha1

  build-linux-riscv64:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      DEBUG_LEVEL: 0
      J: "100%"
    steps:
      - uses: actions/checkout@v5
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockerriscv64 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux riscv64 targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockerriscv64
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-linux-riscv64
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux-riscv64.so
            java/target/rocksdbjni-*-linux-riscv64.jar
            java/target/rocksdbjni-*-linux-riscv64.jar.sha1

  build-linux-s390x:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    needs:
      - prepare-musl-s390x
    env:
      DEBUG_LEVEL: 0
      J: "100%"
      ROCKSDB_GNU_CROSS_CACHE: /tmp/rocksdb-gnu-cross
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-gnu-musl-cross-s390x
          path: /tmp/rocksdb-gnu-cross/toolchains
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticdockers390x 2>&1 | grep -q "Compiling in debug mode"
      - name: Build Linux s390x targets
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockers390x
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticdockers390xmusl
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-linux-s390x
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-linux-s390x.so
            java/target/librocksdbjni-linux-s390x-musl.so
            java/target/rocksdbjni-*-linux-s390x.jar
            java/target/rocksdbjni-*-linux-s390x-musl.jar
            java/target/rocksdbjni-*-linux-s390x.jar.sha1
            java/target/rocksdbjni-*-linux-s390x-musl.jar.sha1

  build-osx:
    runs-on: macos-14
    timeout-minutes: 240
    env:
      DEBUG_LEVEL: 0
      J: "100%"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: "8"
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${DEBUG_LEVEL}" = "0"
          ! make -n DEBUG_LEVEL="${DEBUG_LEVEL}" rocksdbjavastaticosx 2>&1 | grep -q "Compiling in debug mode"
      - name: Build osx targets
        run: |
          set -euxo pipefail
          java -version
          javac -version
          make DEBUG_LEVEL="${DEBUG_LEVEL}" J="${J}" rocksdbjavastaticosx
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-osx
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-osx-arm64.jnilib
            java/target/librocksdbjni-osx-x86_64.jnilib
            java/target/rocksdbjni-*-osx.jar
            java/target/rocksdbjni-*-osx.jar.sha1

  build-win64:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      DEBUG_LEVEL: 0
      CMAKE_BUILD_TYPE: Release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
      - name: Verify Release Mode
        run: |
          set -euxo pipefail
          test "${CMAKE_BUILD_TYPE}" = "Release"
      - name: Install Mingw Toolchain
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64
          if update-alternatives --query x86_64-w64-mingw32-g++ >/dev/null 2>&1; then
            sudo update-alternatives --set x86_64-w64-mingw32-g++ /usr/bin/x86_64-w64-mingw32-g++-posix || true
          fi
      - name: Build win64 target
        run: |
          set -euxo pipefail
          make DEBUG_LEVEL="${DEBUG_LEVEL}" CMAKE_BUILD_TYPE="${CMAKE_BUILD_TYPE}" rocksdbjavastaticwin64
          jar tf java/target/rocksdbjni-*-win64.jar | grep -Fx 'librocksdbjni-win64.dll'
      - uses: actions/upload-artifact@v6
        with:
          name: rocksdbjni-win64
          if-no-files-found: error
          path: |
            java/target/librocksdbjni-win64.dll
            java/target/rocksdbjni-*-win64.jar
            java/target/rocksdbjni-*-win64.jar.sha1

  assemble-release-artifacts:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    needs:
      - build-linux-x86
      - build-linux-x64
      - build-linux-aarch64
      - build-linux-ppc64le
      - build-linux-riscv64
      - build-linux-s390x
      - build-osx
      - build-win64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-linux-x86
          path: artifacts/linux-x86
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-linux-x64
          path: artifacts/linux-x64
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-linux-aarch64
          path: artifacts/linux-aarch64
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-linux-ppc64le
          path: artifacts/linux-ppc64le
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-linux-riscv64
          path: artifacts/linux-riscv64
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-linux-s390x
          path: artifacts/linux-s390x
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-osx
          path: artifacts/osx
      - uses: actions/download-artifact@v7
        with:
          name: rocksdbjni-win64
          path: artifacts/win64
      - name: Assemble And Verify Fat Jar
        shell: bash
        run: |
          set -euxo pipefail

          find_one() {
            local root="$1"
            local name="$2"
            find "${root}" -type f -name "${name}" | head -n1
          }

          validate_gnu_cxx_abi() {
            local native="$1"
            if nm -D "${native}" | grep -Eq 'NSt3__1|St3__1'; then
              echo "Unexpected libc++ symbol namespace in ${native}"
              exit 1
            fi
            if strings "${native}" | grep -Eq 'libc\+\+|libc\+\+abi'; then
              echo "Unexpected libc++ runtime reference in ${native}"
              exit 1
            fi
            if ! nm -D "${native}" | grep -Eq 'St7__cxx11' && \
               ! readelf -d "${native}" | grep -Eq 'libstdc\+\+\.so\.6' && \
               ! strings "${native}" | grep -Eq 'libstdc\+\+\.so\.6'; then
              echo "Could not confirm GNU libstdc++ ABI in ${native}"
              exit 1
            fi
          }

          extract_max_version() {
            local native="$1"
            local prefix="$2"
            objdump -T "${native}" 2>/dev/null | grep -Eo "${prefix}_[0-9]+\.[0-9]+(\.[0-9]+)?" | sed "s/^${prefix}_//" | sort -Vu | tail -n1
          }

          validate_max_symbol_version() {
            local native="$1"
            local prefix="$2"
            local expected_max="$3"
            local actual_max

            [ -n "${expected_max}" ] || return 0
            actual_max="$(extract_max_version "${native}" "${prefix}")"
            [ -n "${actual_max}" ] || return 0

            if [ "$(printf '%s\n%s\n' "${expected_max}" "${actual_max}" | sort -V | tail -n1)" != "${expected_max}" ]; then
              echo "${native} exceeds official ${prefix} floor: expected <= ${expected_max}, got ${actual_max}"
              exit 1
            fi
          }

          validate_official_linux_abi_floor() {
            local native="$1"
            local base
            local max_glibc=""
            local max_glibcxx=""
            local max_cxxabi=""

            base="$(basename "${native}")"
            case "${base}" in
              librocksdbjni-linux32.so|librocksdbjni-linux64.so)
                max_glibc='2.16'
                max_glibcxx='3.4.19'
                max_cxxabi='1.3.7'
                ;;
              librocksdbjni-linux-aarch64.so|librocksdbjni-linux-ppc64le.so)
                max_glibc='2.17'
                max_glibcxx='3.4.19'
                max_cxxabi='1.3.7'
                ;;
              librocksdbjni-linux-s390x.so)
                max_glibc='2.12'
                max_glibcxx='3.4.22'
                max_cxxabi='1.3.11'
                ;;
              librocksdbjni-linux-riscv64.so)
                max_glibc='2.30'
                max_glibcxx='3.4.26'
                max_cxxabi='1.3.11'
                ;;
              *)
                return 0
                ;;
            esac

            validate_max_symbol_version "${native}" GLIBC "${max_glibc}"
            validate_max_symbol_version "${native}" GLIBCXX "${max_glibcxx}"
            validate_max_symbol_version "${native}" CXXABI "${max_cxxabi}"
          }

          validate_musl_loader_and_deps() {
            local native="$1"
            local base
            local expected_loader=""

            base="$(basename "${native}")"
            case "${base}" in
              librocksdbjni-linux32-musl.so)
                expected_loader='libc.musl-x86.so.1'
                ;;
              librocksdbjni-linux64-musl.so)
                expected_loader='libc.musl-x86_64.so.1'
                ;;
              librocksdbjni-linux-aarch64-musl.so)
                expected_loader='libc.musl-aarch64.so.1'
                ;;
              librocksdbjni-linux-ppc64le-musl.so)
                expected_loader='libc.musl-ppc64le.so.1'
                ;;
              librocksdbjni-linux-s390x-musl.so)
                expected_loader='libc.musl-s390x.so.1'
                ;;
              *)
                return 0
                ;;
            esac

            if ! objdump -p "${native}" | grep -Eq "${expected_loader}"; then
              echo "Unexpected musl loader dependency in ${native}; expected ${expected_loader}"
              objdump -p "${native}" | grep -E 'NEEDED|INTERP' || true
              exit 1
            fi
            objdump -p "${native}" | grep -Eq 'libstdc\+\+\.so\.6'
            objdump -p "${native}" | grep -Eq 'libgcc_s\.so\.1'
          }

          mkdir -p java/target output
          cp "$(find_one artifacts/linux-x86 'librocksdbjni-linux32.so')" java/target/
          cp "$(find_one artifacts/linux-x64 'librocksdbjni-linux64.so')" java/target/
          cp "$(find_one artifacts/linux-x86 'librocksdbjni-linux32-musl.so')" java/target/
          cp "$(find_one artifacts/linux-x64 'librocksdbjni-linux64-musl.so')" java/target/
          cp "$(find_one artifacts/linux-aarch64 'librocksdbjni-linux-aarch64.so')" java/target/
          cp "$(find_one artifacts/linux-aarch64 'librocksdbjni-linux-aarch64-musl.so')" java/target/
          cp "$(find_one artifacts/linux-ppc64le 'librocksdbjni-linux-ppc64le.so')" java/target/
          cp "$(find_one artifacts/linux-ppc64le 'librocksdbjni-linux-ppc64le-musl.so')" java/target/
          cp "$(find_one artifacts/linux-s390x 'librocksdbjni-linux-s390x.so')" java/target/
          cp "$(find_one artifacts/linux-s390x 'librocksdbjni-linux-s390x-musl.so')" java/target/
          cp "$(find_one artifacts/linux-riscv64 'librocksdbjni-linux-riscv64.so')" java/target/
          cp "$(find_one artifacts/osx 'librocksdbjni-osx-arm64.jnilib')" java/target/
          cp "$(find_one artifacts/osx 'librocksdbjni-osx-x86_64.jnilib')" java/target/
          cp "$(find_one artifacts/win64 'librocksdbjni-win64.dll')" java/target/

          for native in java/target/librocksdbjni-linux*.so; do
            ! nm -D "${native}" | grep -Eq '__ubsan_|__asan_|__tsan_'
            validate_gnu_cxx_abi "${native}"
            validate_official_linux_abi_floor "${native}"
            validate_musl_loader_and_deps "${native}"
          done

          make DEBUG_LEVEL=0 rocksdbjava_javadocs_jar rocksdbjava_sources_jar rocksdbjavastaticpreparepomartifact
          make DEBUG_LEVEL=0 rocksdbjavastaticfatjarassemble
          FAT_JAR="$(find java/target -maxdepth 1 -type f -name 'rocksdbjni-*.jar' ! -name '*-linux*.jar' ! -name '*-osx.jar' ! -name '*-win64.jar' ! -name '*-javadoc.jar' ! -name '*-sources.jar' | head -n1)"
          test -n "${FAT_JAR}"
          VERSION="${FAT_JAR##*/rocksdbjni-}"
          VERSION="${VERSION%.jar}"

          # Validate native entry-name parity with 10.2.1.
          jar tf "${FAT_JAR}" | grep -E '^librocksdbjni-.*\.(so|jnilib|dll)$' | sort > actual-natives.txt
          curl -L -o rocksdbjni-10.2.1.jar https://repo1.maven.org/maven2/org/rocksdb/rocksdbjni/10.2.1/rocksdbjni-10.2.1.jar
          jar tf rocksdbjni-10.2.1.jar | grep -E '^librocksdbjni-.*\.(so|jnilib|dll)$' | sort > expected-natives.txt
          diff -u expected-natives.txt actual-natives.txt
          test "$(wc -l < actual-natives.txt)" -eq 14

          # Validate binary formats.
          file java/target/librocksdbjni-linux64.so | grep -q 'ELF 64-bit'
          file java/target/librocksdbjni-linux-riscv64.so | grep -q 'ELF 64-bit'
          file java/target/librocksdbjni-win64.dll | grep -Eq 'PE32\+ executable|PE32\+ DLL'
          readelf -h java/target/librocksdbjni-linux64.so | grep -q 'Machine:'

          cp "${FAT_JAR}" output/
          cp "${FAT_JAR}.sha1" output/
          cp "java/target/rocksdbjni-${VERSION}.pom" output/
          cp "java/target/rocksdbjni-${VERSION}.pom.sha1" output/
          cp "java/target/rocksdbjni-${VERSION}-javadoc.jar" output/
          cp "java/target/rocksdbjni-${VERSION}-javadoc.jar.sha1" output/
          cp "java/target/rocksdbjni-${VERSION}-sources.jar" output/
          cp "java/target/rocksdbjni-${VERSION}-sources.jar.sha1" output/

          cp "$(find_one artifacts/linux-x86 'rocksdbjni-*-linux32.jar')" output/
          cp "$(find_one artifacts/linux-x64 'rocksdbjni-*-linux64.jar')" output/
          cp "$(find_one artifacts/linux-x86 'rocksdbjni-*-linux32-musl.jar')" output/
          cp "$(find_one artifacts/linux-x64 'rocksdbjni-*-linux64-musl.jar')" output/
          cp "$(find_one artifacts/linux-x86 'rocksdbjni-*-linux32.jar.sha1')" output/
          cp "$(find_one artifacts/linux-x64 'rocksdbjni-*-linux64.jar.sha1')" output/
          cp "$(find_one artifacts/linux-x86 'rocksdbjni-*-linux32-musl.jar.sha1')" output/
          cp "$(find_one artifacts/linux-x64 'rocksdbjni-*-linux64-musl.jar.sha1')" output/
          cp "$(find_one artifacts/osx 'rocksdbjni-*-osx.jar')" output/
          cp "$(find_one artifacts/osx 'rocksdbjni-*-osx.jar.sha1')" output/
          cp "$(find_one artifacts/win64 'rocksdbjni-*-win64.jar')" output/
          cp "$(find_one artifacts/win64 'rocksdbjni-*-win64.jar.sha1')" output/
